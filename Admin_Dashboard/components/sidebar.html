<script>
// Set active navigation item based on current page
function setActiveNavigation() {
    // Get current page filename
    const currentPage = window.location.pathname.split('/').pop();
    console.log('Current page:', currentPage); // Debug log
    
    // Remove active class from all nav links
    document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
    });
    
    // Add active class to current page link
    const activeLink = document.querySelector(`.nav-link[data-page="${currentPage.replace('.php', '')}"]`);
    console.log('Active link found:', activeLink); // Debug log
    
    if (activeLink) {
        activeLink.classList.add('active');
        console.log('Active class added to:', activeLink); // Debug log
    } else {
        console.log('No matching link found for page:', currentPage);
    }
}

// Run on page load
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM loaded, setting active navigation');
    setActiveNavigation();
});

// Also run when sidebar is dynamically loaded
window.addEventListener('load', function() {
    // Wait a bit for sidebar to load
    setTimeout(setActiveNavigation, 100);
});

// Also run when URL changes (for SPA-like navigation)
window.addEventListener('popstate', function() {
    setTimeout(setActiveNavigation, 100);
});
</script>

<script>
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('active');
}

// Set active nav item based on current page
document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop().split('.')[0];
    const navLinks = document.querySelectorAll('.nav-link');
    
    navLinks.forEach(link => {
        link.classList.remove('active');
        if (link.dataset.page === currentPage) {
            link.classList.add('active');
        }
    });
});
</script>
